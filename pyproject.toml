[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-auto-publish"
version = "1.0.5"
description = "Outermost WeChat Official Account pipeline: compose wechat-formatter (render) + wechat-publish (draft) into one command."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "程序员白大力" }]
keywords = ["wechat", "wechat-mp", "公众号", "pipeline", "draft", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
# 上游两个组件；按需替换成你自己的 fork / 版本
dependencies = [
    "wechat-formatter",
    # >=1.0.1：正文图片支持本地相对路径转存微信 CDN（v1.0.0 只支持远程 URL）
    "wechat-publish>=1.0.1",
]

[project.scripts]
wechat-auto-publish = "wechat_auto_publish.cli:main"

[project.urls]
Homepage = "https://github.com/baiyigali/wechat-auto-publish"
Repository = "https://github.com/baiyigali/wechat-auto-publish"

[tool.setuptools]
packages = ["wechat_auto_publish"]

[tool.setuptools.package-data]
wechat_auto_publish = ["py.typed"]
