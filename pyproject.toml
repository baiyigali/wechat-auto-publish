[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-auto-publish"
version = "1.0.2"
description = "Outermost WeChat Official Account pipeline: compose opp-radar (generation) + wechat-formatter (render) + wechat-publish (draft) into one command."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "程序员白大力" }]
keywords = ["wechat", "wechat-mp", "公众号", "pipeline", "draft", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
# 上游三个组件；按需替换成你自己的 fork / 版本
dependencies = [
    "wechat-formatter",
    "wechat-publish",
    # opp-radar 是提示词仓库，尚未发 PyPI 时直接引用 GitHub：
    # "opp-radar @ git+https://github.com/baiyigali/opp_radar.git",
]

[project.scripts]
wechat-auto-publish = "wechat_auto_publish.cli:main"

[project.urls]
Homepage = "https://github.com/baiyigali/wechat-auto-publish"
Repository = "https://github.com/baiyigali/wechat-auto-publish"

[tool.setuptools]
packages = ["wechat_auto_publish"]

[tool.setuptools.package-data]
wechat_auto_publish = ["py.typed"]
